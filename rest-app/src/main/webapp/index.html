<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JAX-RS REST Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 50%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>JAX-RS Catalog Service</h2>

    <div class="form-group">
        <label for="itemId">ID:</label>
        <input type="text" id="itemId" />
    </div>
    <div class="form-group">
        <label for="itemName">Name:</label>
        <input type="text" id="itemName" />
    </div>
    <div class="form-group">
        <label for="itemPrice">Price:</label>
        <input type="number" step="0.01" id="itemPrice" />
    </div>
    <button onclick="addItem()">Add Item</button>

    <h3>Inventory List</h3>
    <button onclick="fetchItems()">Refresh Inventory</button>

    <table id="itemsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        function fetchItems() {
            fetch('api/items')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.querySelector('#itemsTable tbody');
                    tbody.innerHTML = '';
                    data.forEach(item => {
                        const row = `<tr><td>${item.id}</td><td>${item.name}</td><td>${item.price}</td></tr>`;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => console.error('Fetch error:', err));
        }

        function addItem() {
            const item = {
                id: document.getElementById('itemId').value,
                name: document.getElementById('itemName').value,
                price: parseFloat(document.getElementById('itemPrice').value)
            };

            fetch('api/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            })
            .then(res => {
                if (res.ok) {
                    fetchItems();
                    document.getElementById('itemId').value = '';
                    document.getElementById('itemName').value = '';
                    document.getElementById('itemPrice').value = '';
                } else {
                    alert('Failed to save item');
                }
            });
        }

        window.onload = fetchItems;
    </script>
</body>
</html>
